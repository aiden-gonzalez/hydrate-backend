# Self-hosted production stack: Postgres + API + Caddy (automatic HTTPS) + nightly database backups.
# See deploy/README.md. Run from the deploy/ directory:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: hydrate

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLOUD_PG_DB}
      POSTGRES_USER: ${CLOUD_PG_USER}
      POSTGRES_PASSWORD: ${CLOUD_PG_PASS}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only reachable by the other containers

  api:
    build:
      context: ..
      dockerfile: CloudDockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: cloud
      PORT: 3000
      CLOUD_PG_HOST: db
      TRUST_PROXY: 1 # Caddy
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${CLOUD_PG_DB}
      PGUSER: ${CLOUD_PG_USER}
      PGPASSWORD: ${CLOUD_PG_PASS}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
